$kind: http-request
name: display 범위 초과
order: 3000
method: GET
url: '{{search_base_url}}/search/v1/local?query=맛집&display=6&start=1&format=json'
headers:
  - key: X-NCP-APIGW-API-KEY-ID
    value: '{{naver_search_client_id}}'
  - key: X-NCP-APIGW-API-KEY
    value: '{{naver_search_client_secret}}'
queryParams:
  - key: query
    value: '맛집'
  - key: display
    value: '6'
  - key: start
    value: '1'
  - key: format
    value: 'json'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |
      pm.test("400 SE02", () => { pm.response.to.have.status(400); pm.expect(pm.response.json().errorCode).to.equal("SE02"); });
