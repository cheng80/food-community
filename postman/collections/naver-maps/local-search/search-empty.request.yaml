$kind: http-request
name: 검색 결과 없음
order: 2000
method: GET
url: '{{search_base_url}}/search/v1/local?query={{no_result_query}}&display=5&start=1&format=json'
headers:
  - key: X-NCP-APIGW-API-KEY-ID
    value: '{{naver_search_client_id}}'
  - key: X-NCP-APIGW-API-KEY
    value: '{{naver_search_client_secret}}'
queryParams:
  - key: query
    value: '{{no_result_query}}'
  - key: display
    value: '5'
  - key: start
    value: '1'
  - key: format
    value: 'json'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |
      pm.test("200이고 items가 빈 배열", () => { pm.response.to.have.status(200); pm.expect(pm.response.json().items).to.eql([]); });
